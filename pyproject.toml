[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyle-ai"
version = "0.1.0"
description = "Local-first modular AI workbench with transparent retrieval, analysis, forecasting and vision diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Skyle AI contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pandas>=2.2,<4.0",
  "numpy>=1.26,<3.0",
  "Pillow>=10,<12",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0", "ruff>=0.7,<1.0"]

[project.scripts]
skyle-ai = "skyle_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skyle_ai = ["static/*", "data/demo/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
